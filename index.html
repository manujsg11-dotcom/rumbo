<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Plan de estudio para Bachillerato: exámenes, notas, horario y calculadora de la PAU.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>html,body{margin:0}body{padding-top:env(safe-area-inset-top,0px)}</style>
<title>Rumbo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#161618">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Rumbo">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&display=swap">
<style>
/* Una columna tipo app de móvil, tarjetas oscuras, barra inferior fija */
:root{color-scheme:dark;--bg:#161618;--card:#212124;--card2:#2a2a2e;--line:#323237;--tx:#f3f3f5;--mut:#9b9ba3;--dim:#66666e;--acc:#2f7cf6;--acc2:#5b9bff;--ok:#22c55e;--warn:#e9b23c;--bad:#ef4444;--r:22px;--track:#2a2a2e;--bar2:#3d5f99;--free:#3a3a41;--logo-bg:#fff;--logo-fg:#111;--logo-fg2:#555;
  --ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI Variable","Segoe UI",Roboto,sans-serif;--num:"Barlow Condensed","SF Compact Display","Arial Narrow",var(--ui)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--tx)}
body{font-family:var(--ui);-webkit-font-smoothing:antialiased;font-size:15px;min-height:100%;overscroll-behavior-y:none}
button,input,select,textarea{font-family:inherit;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--acc2);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding-block:16px calc(112px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.logo{width:44px;height:44px;border-radius:12px;flex:none;display:block}
.chip{display:inline-flex;align-items:center;gap:7px;height:40px;padding:0 14px;border:1px solid var(--line);border-radius:999px;font-weight:650;font-size:15px;background:transparent;cursor:pointer}
.sp{flex:1}
.streak{display:flex;align-items:center;gap:4px;color:var(--mut);font-weight:750;font-size:17px;padding:0 6px}
.streak.hot{color:var(--warn)}
.ring{width:44px;height:44px;position:relative;cursor:pointer;flex:none}
.ring svg{transform:rotate(-90deg);display:block}
.ring span{position:absolute;inset:0;display:grid;place-items:center;font-weight:800;color:var(--acc2);font-size:15px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;margin-bottom:12px}
.card.tight{padding:14px 16px}
.eyebrow{font-size:12.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--mut);font-weight:750}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.meta{display:flex;align-items:center;gap:8px;color:var(--mut);font-size:14.5px;margin-top:10px}
.big{font-size:25px;line-height:1.22;font-weight:800;margin:8px 0 10px;letter-spacing:-.01em;text-wrap:balance}
.mut{color:var(--mut)}.dim{color:var(--dim)}.small{font-size:13.5px}.warnc{color:var(--warn)}.okc{color:var(--ok)}
.num{font-family:var(--num);font-weight:600;letter-spacing:-.01em;font-variant-numeric:tabular-nums;line-height:1}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;height:50px;border:0;border-radius:14px;background:#236ad9;color:#fff;font-weight:700;font-size:17px;cursor:pointer}
.btn:active{transform:scale(.985)}
.btn.ghost{background:var(--card2);color:var(--tx)}
.btn.danger{background:rgba(239,68,68,.14);color:#ff7b7b}
.btn.sm{height:36px;font-size:14px;border-radius:11px;width:auto;padding:0 14px}
.btn.icon{width:38px;height:38px;padding:0;border-radius:12px;flex:none}
.circ{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:none;display:grid;place-items:center;cursor:pointer;color:var(--mut);flex:none}
.link{display:flex;justify-content:center;align-items:center;gap:6px;color:var(--acc2);font-weight:700;margin-top:14px;background:none;border:0;font-size:15.5px;width:100%;cursor:pointer}
.link.left{justify-content:flex-start;width:auto;padding:0;text-align:left}
.row{display:flex;align-items:center;gap:12px}
.between{display:flex;align-items:center;justify-content:space-between;gap:12px}
.badge{width:30px;height:30px;border-radius:50%;background:var(--acc);color:#fff;display:grid;place-items:center;font-weight:800;font-size:14px;flex:none}
.tap{cursor:pointer}
h2{font-size:21px;margin:26px 2px 12px;font-weight:800;letter-spacing:-.01em}
h3{font-size:16px;margin:18px 0 10px;font-weight:750}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
svg.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
svg.i.s{width:18px;height:18px}
.warnbox{display:flex;gap:10px;align-items:flex-start;background:rgba(233,178,60,.1);border:1px solid rgba(233,178,60,.3);color:#f3cf7c;border-radius:14px;padding:10px 12px;font-size:13.5px;line-height:1.4;margin-top:14px}

nav.tab{position:fixed;left:0;right:0;bottom:0;background:rgba(30,30,33,.92);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--line);padding-top:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));z-index:20}
nav.tab .in{max-width:640px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:4px}
.tb{height:50px;min-width:52px;border-radius:999px;border:1px solid transparent;background:none;color:var(--mut);display:flex;align-items:center;justify-content:center;gap:8px;padding:0 14px;font-weight:650;font-size:15px;cursor:pointer}
.tb.on{background:rgba(47,124,246,.14);border-color:rgba(47,124,246,.45);color:var(--tx)}
.tb.on svg{color:var(--acc2)}
.tb .lb{display:none}.tb.on .lb{display:inline}
@media (min-width:700px){.tb .lb{display:inline}}
.fab{width:56px;height:56px;border-radius:50%;background:var(--acc);border:0;color:#fff;display:grid;place-items:center;cursor:pointer;box-shadow:0 6px 22px rgba(47,124,246,.38);flex:none}
.fab svg{width:28px;height:28px;stroke-width:2.4}

.calhead{display:flex;align-items:center;gap:6px;margin-bottom:14px}
.calhead .ttl{font-size:17px;font-weight:750;min-width:0;flex:1;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.navb{width:34px;height:34px;border-radius:10px;border:0;background:none;color:var(--mut);display:grid;place-items:center;cursor:pointer;flex:none}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;padding:3px;background:var(--bg)}
.seg button{border:0;background:none;color:var(--mut);height:36px;padding:0 12px;border-radius:9px;font-weight:650;font-size:14px;cursor:pointer}
.seg button.on{background:var(--card2);color:var(--tx)}
.seg.full{display:flex;margin-bottom:10px}.seg.full button{flex:1}
.grid7{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.wd{color:var(--mut);font-weight:650;font-size:13px;padding:4px 0 8px}
.day{position:relative;height:52px;border-radius:12px;border:1.5px solid transparent;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:16px;font-weight:550;cursor:pointer;color:var(--tx)}
.month .day{height:44px;font-size:14.5px}
.day.past{color:var(--mut);font-weight:400}
.day.out{opacity:.35}
.day.today{border-color:var(--acc);color:var(--acc2);font-weight:800}
.day.sel{background:var(--card2)}
.dots{display:flex;gap:3px;height:5px}
.dots i{width:5px;height:5px;border-radius:50%;display:block}

.item{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.cbar{width:4px;align-self:stretch;border-radius:4px;flex:none}
.pill{font-size:12.5px;font-weight:700;padding:4px 9px;border-radius:999px;background:var(--card2);color:var(--mut);white-space:nowrap}
.pill.hot{background:rgba(239,68,68,.15);color:#ff8a8a}
.pill.warm{background:rgba(233,178,60,.15);color:#f3cf7c}
.pill.blue{background:rgba(47,124,246,.15);color:var(--acc2)}
.check{width:28px;height:28px;border-radius:50%;border:2px solid var(--line);background:none;display:grid;place-items:center;cursor:pointer;flex:none;color:#fff}
.check.on{background:var(--ok);border-color:var(--ok)}
.bar{height:6px;background:var(--card2);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--card2);border-radius:16px;padding:14px}
.stat b{display:block;font-size:22px;font-weight:800;margin-top:4px}

/* Plan: tira de la semana */
.wk{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin:18px 0 8px}
.wkd{border:1.5px solid transparent;background:var(--card2);border-radius:14px;padding:8px 0;display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;color:var(--tx);min-width:0}
.wkd.on{border-color:var(--acc);background:rgba(47,124,246,.12)}
.wkd b{font-size:16px}
.wkd .small{font-size:11.5px;white-space:nowrap}
.wkbar{position:relative;width:14px;height:58px;border-radius:5px;background:var(--bg);overflow:hidden}
.wkbar i{position:absolute;bottom:0;border-radius:4px}
.wkbar .av{left:0;right:0;background:var(--free)}
.wkbar .pl{left:3px;right:3px;background:var(--acc)}
.wkbar .pl.over{background:var(--warn)}
.freebar{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--card2);border-radius:14px;padding:8px 8px 8px 14px;margin:12px 0 6px}
details.how{margin-top:12px}
details.how summary{cursor:pointer;color:var(--acc2);font-weight:700;list-style:none;padding:6px 2px}
details.how summary::-webkit-details-marker{display:none}
/* Perfil */
.prof{display:flex;align-items:center;gap:14px;margin:4px 0 20px}
.avatar{width:64px;height:64px;border-radius:50%;background:var(--card2);border:1px solid var(--line);display:grid;place-items:center;font-weight:800;font-size:22px;color:var(--mut);flex:none}
.prof .nm{font-size:24px;font-weight:800;letter-spacing:-.01em}
.course{display:flex;align-items:flex-end;gap:22px;flex-wrap:wrap}
.course .num.xl{font-size:76px}
.course .num.lg{font-size:44px;color:var(--acc2)}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;border-top:1px solid var(--line);margin-top:20px;padding-top:18px}
.trio .num{font-size:36px}
.trio span{display:block;color:var(--mut);font-size:14px;margin-top:6px;line-height:1.3}
.sgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.scard{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;cursor:pointer;display:flex;flex-direction:column;gap:14px;min-width:0;text-align:left}
.letter{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;font-weight:800;color:#fff;font-size:19px;flex:none}
.scard .shead{display:flex;flex-direction:column;align-items:flex-start;gap:10px}
.scard .nm{font-size:16px;font-weight:600;line-height:1.25;min-width:0;overflow-wrap:break-word;hyphens:manual}
.scard .num{font-size:34px}
.scard .st{font-size:13.5px;font-weight:600}
.bdg{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.bdg div{background:var(--card2);border-radius:16px;padding:14px 8px;text-align:center;font-size:12.5px;line-height:1.3}
.bdg div b{display:block;font-size:13.5px;margin:6px 0 2px}
.bdg div.off{opacity:.38}
.bdg svg{width:28px;height:28px}

label.f{display:block;font-size:13px;color:var(--mut);font-weight:650;margin:14px 0 6px}
.inp{width:100%;height:46px;border-radius:12px;border:1px solid var(--line);background:var(--bg);padding:0 14px;font-size:16px;outline:none}
.inp:focus{border-color:var(--acc)}
textarea.inp{height:96px;padding:12px 14px;resize:vertical;line-height:1.4}
.inp.n{width:84px;text-align:center;height:40px;padding:0 6px}
select.inp{appearance:none;-webkit-appearance:none}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{border:1px solid var(--line);background:none;border-radius:999px;height:36px;padding:0 12px;display:inline-flex;align-items:center;gap:7px;font-size:14px;font-weight:600;cursor:pointer;color:var(--mut)}
.chips button.on{border-color:var(--acc);color:var(--tx);background:rgba(47,124,246,.12)}
.calcrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.calcrow:first-of-type{border-top:0}
.res{display:flex;align-items:baseline;justify-content:space-between;padding:12px 14px;border-radius:14px;background:var(--card2);margin-top:10px}
.res b{font-size:26px;font-weight:850}
.note{font-size:13.5px;color:var(--mut);line-height:1.5;background:var(--bg);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:12px}
.est{background:rgba(47,124,246,.1);border:1px solid rgba(47,124,246,.3);border-radius:14px;padding:12px 14px;margin-top:14px;font-size:14px;line-height:1.45}
.est b{color:var(--acc2)}
.step{display:flex;align-items:center;gap:8px}
.step b{min-width:34px;text-align:center;font-size:18px}
.files{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.files a,.files div{aspect-ratio:1;max-width:100%;border-radius:12px;background:var(--card2);overflow:hidden;display:flex;align-items:center;justify-content:center;text-decoration:none;color:var(--mut);font-size:12px;position:relative;text-align:center;padding:6px}
.files img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}

.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40;display:none;align-items:flex-end;justify-content:center}
.ov.on{display:flex}
.sheet{background:#1d1d20;border:1px solid var(--line);border-bottom:0;width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:26px 26px 0 0;padding-top:10px;padding-bottom:calc(24px + env(safe-area-inset-bottom,0px));padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));animation:up .38s var(--ease)}
@media (min-width:700px){.ov{align-items:center}.sheet{border-radius:26px;border-bottom:1px solid var(--line)}}
@keyframes up{from{transform:translateY(70px);opacity:0}to{transform:none;opacity:1}}
.grab{width:40px;height:5px;border-radius:5px;background:var(--line);margin:4px auto 14px}
.sheet h2{margin-top:4px}
.qa{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.qa button{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:10px;font-weight:700;font-size:15px}
.qa button small{color:var(--mut);font-weight:500;font-size:12.5px}
.qa .ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center}
.timer{display:grid;place-items:center;margin:10px 0 18px;position:relative}
.timer svg{max-width:100%}
.timer .t{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.timer .t b{font-size:46px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(24px) scale(.94);background:#2b2b30;border:1px solid var(--line);padding:11px 16px;border-radius:14px;font-weight:650;font-size:14.5px;opacity:0;transition:opacity .22s ease,transform .45s var(--spring);box-shadow:0 10px 30px rgba(0,0,0,.3);z-index:60;pointer-events:none;max-width:90vw;text-align:center}
.toast.on{opacity:1;transform:translateX(-50%)}
.empty{color:var(--mut);text-align:center;padding:14px 0;font-size:14.5px}
/* Racha */
.flame{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:var(--card2);color:var(--dim);flex:none}
.flame.on{background:rgba(233,178,60,.16);color:var(--warn)}
.swk{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-top:14px;text-align:center}
.swk span{font-size:12px;color:var(--mut);font-weight:650}
.swk i{display:grid;place-items:center;width:32px;height:32px;margin:5px auto 0;border-radius:50%;background:var(--card2);color:var(--dim);font-style:normal;font-size:14px}
.swk i.on{background:rgba(233,178,60,.2);color:var(--warn)}
.swk i.td{box-shadow:0 0 0 2px var(--acc)}
.swk i.fut{background:none;border:1.5px dashed var(--line)}
/* Gráficas */
svg.chart{width:100%;height:auto;display:block;overflow:visible}
.chart .gl{stroke:#2c2c31}
.chart .tg{stroke:var(--mut);stroke-dasharray:4 4}
.chart .ax{fill:var(--dim);font-size:10.5px}
.chart .vl{fill:var(--tx);font-size:12px;font-weight:700}
.chart .pt{cursor:pointer}
.chart .pt.sel circle:last-of-type{stroke:var(--tx)}
.ctip{margin-top:8px;min-height:18px}
/* Selector de estilo (Ajustes) */
/* De 3 en 3; si la última fila no se llena, queda centrada */
.themes{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.themes button{flex:0 0 calc((100% - 16px)/3);min-width:0;border:1.5px solid var(--line);background:none;border-radius:14px;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:13px;font-weight:650;cursor:pointer;color:var(--tx)}
.themes button.on{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
.tsw{width:46px;height:30px;border-radius:8px;display:flex;align-items:flex-end;gap:3px;padding:5px;border:1px solid rgba(128,128,128,.35)}
.tsw i{flex:1;height:10px;border-radius:3px}
.deco{display:none}
/* Zona de toque de al menos 44 px en los botones pequeños, sin cambiar cómo se ven */
.check,.navb,.btn.icon,.circ,.link{position:relative}
.check::after,.navb::after,.btn.icon::after,.circ::after{content:"";position:absolute;inset:-8px}
.calhead .navb{width:44px;height:44px}
.link:not(.minib)::after{content:"";position:absolute;inset:-12px -4px}
.minib{background:var(--card2);border-radius:999px;padding:8px 12px!important;font-weight:600;margin:0!important;min-height:36px}
/* Cuestionario inicial */
body.onbm nav.tab{display:none}
.onb{max-width:520px;margin:0 auto;padding-top:6px}
.onb .big{font-size:27px;margin:14px 0 8px}
.obdots{display:flex;gap:6px;margin:4px 0 6px}.obdots i{flex:1;height:4px;border-radius:4px;background:var(--line)}.obdots i.on{background:var(--acc)}
.opt{display:block;width:100%;text-align:left;padding:14px 16px;border:1.5px solid var(--line);border-radius:16px;background:var(--card);color:var(--tx);margin-top:10px;cursor:pointer;font:inherit}
.opt.on{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}.opt b{display:block;font-size:16.5px;margin-bottom:3px}.opt span{color:var(--mut);font-size:13.5px;line-height:1.35}
.obnav{display:flex;gap:10px;margin:26px 0 30px}.obnav .btn.ghost{width:auto;padding:0 20px}
.btn:disabled,.chips button:disabled{opacity:.4;cursor:default}
.onb .chips button svg{margin-left:-3px}
/* Nombres largos de materia: la etiqueta pasa a dos líneas en vez de salirse de la pantalla */
.chips button{height:auto;min-height:36px;padding-top:6px;padding-bottom:6px;max-width:100%;text-align:left;line-height:1.25}
/* Retoques visuales */
.card.tight>.between:first-child{margin-bottom:6px}
.between:has(>h2){align-items:flex-end}.between:has(>h2)>.circ{margin-bottom:8px}
.loading{display:grid;place-items:center;height:70vh}.loading svg{width:56px;height:56px;animation:breathe 1.4s ease-in-out infinite}

/* ====== Animaciones ======
   Entrada escalonada al cambiar de pestaña (#main.enter), hojas que suben y bajan,
   botones que responden al toque y barras, anillos y gráficas que se dibujan.
   Lo que se repinta en cada clic solo se anima cuando cambia de verdad (FX en el script). */
:root{--ease:cubic-bezier(.22,.9,.24,1);--spring:cubic-bezier(.34,1.5,.64,1)}

const logKey=l=>l.id||[l.date,l.subj,l.min,l.key||''].join('|');
function mergeStates(L,R){
  if((L.resetAt||0)!==(R.resetAt||0))return (L.resetAt||0)>(R.resetAt||0)?L:R;
  const N=(L.updatedAt||0)>=(R.updatedAt||0)?L:R,O=N===L?R:L,M=JSON.parse(JSON.stringify(N));
  M.del=Object.assign({},O.del,N.del);
  const un=(pre,a,b,key=x=>x.id)=>{const m=new Map();for(const x of a||[])m.set(key(x),x);
    for(const y of b||[]){const k=key(y),x=m.get(k);if(!x||(y.u||0)>(x.u||0))m.set(k,y)}
    return [...m.entries()].filter(([k])=>M.del[pre+k]==null).map(([,x])=>JSON.parse(JSON.stringify(x)))};
  M.events=un('ev:',N.events,O.events);
  // Si un lado tiene la nota y el otro no, la nota se queda
  for(const e of M.events)if(e.grade==null){const o=(O.events||[]).concat(N.events||[]).find(x=>x.id===e.id&&x.grade!=null);if(o){e.grade=o.grade;e.effort=o.effort}}
  M.log=un('log:',N.log,O.log,logKey);M.memos=un('memo:',N.memos,O.memos);M.files=un('file:',N.files,O.files);
  M.subjects=un('subj:',N.subjects,O.subjects);M.xpLog=un('xp:',N.xpLog,O.xpLog);
  M.topics={};for(const s of new Set([...Object.keys(N.topics||{}),...Object.keys(O.topics||{})]))M.topics[s]=un('tp:',(N.topics||{})[s],(O.topics||{})[s]);
  M.planDone={...O.planDone,...N.planDone};
  M.perfect={...O.perfect,...N.perfect};
  return M}

async function initSync(){
  if(!window.claude||typeof window.claude.use!=='function')return setSyncReady();
  try{
    const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);
    claude.use('assets').then(a=>{assetsNS=a}).catch(()=>{});
    if(!db||!user)return setSyncReady();
    const id=await user.id();if(!id)return setSyncReady();
    dbRef=db.doc('data/users/'+id+'/state');
    dbRef.onSnapshot(snap=>{
      if(snap.metadata.hasPendingWrites)return;
      if(!snap.exists){push();setSyncReady();return}
      const d=snap.data();syncState='ok';
      if((d.updatedAt||0)===(S.updatedAt||0))return setSyncReady();
      try{
        const R=hydrate(JSON.parse(d.json)),keepTimer=S.timer,M=hydrate(mergeStates(S,R));
        if(!M.timer&&keepTimer)M.timer=keepTimer;
        const changed=!sameData(M,S);S=M;
        // Si al unir hay algo que el otro dispositivo no tenía, se sube la versión unida
        if(sameData(M,R))S.updatedAt=d.updatedAt;else{S.updatedAt=Math.max(Date.now(),(d.updatedAt||0)+1);push()}
        try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
        if(changed&&!sheetOpen())render();maybeAskGrade()}catch(e){}
      setSyncReady();
    },()=>{syncState='err';setSyncReady()});
  }catch(e){syncState='local';setSyncReady()}}

const evById=id=>S.events.find(e=>e.id===id);
function subjGrades(id){return graded().filter(e=>e.subj===id).sort((a,b)=>a.date<b.date?-1:1)}
// Trimestre de una fecha: 1 (sep–dic), 2 (ene–mar) o 3 (abr–ago), salvo que en Ajustes se hayan puesto
// los días en que empiezan el 2º y el 3º (solo cuentan para el curso de esas fechas)
function trimOf(d){const T=S.trimStart||{},m=+d.slice(5,7);let t=m>=9?1:m<=3?2:3;
  // Las fechas de Ajustes solo mueven la frontera cerca de donde están
  if(T.t2&&Math.abs(diff(d,T.t2))<75&&t<=2)t=d>=T.t2?2:1;
  if(T.t3&&Math.abs(diff(d,T.t3))<75&&t>=2)t=d>=T.t3?3:2;
  return t}
// Cuánto vale cada examen dentro de su trimestre: lo que haya puesto (e.w, en %) o, si no, se reparte a
// partes iguales lo que quede hasta el 100 % entre los demás de ese trimestre
function trimWeights(es){const set=es.filter(e=>e.w!=null),free=es.length-set.length,wa=free?Math.max(0,100-sum(set.map(e=>e.w)))/free:0;
  return es.map(e=>e.w!=null?e.w:wa)}
// Media de cada trimestre de una materia; extra = exámenes hipotéticos (para calcular la nota que hace falta)
function trimAvgs(id,extra=[]){const by={};
  for(const e of subjGrades(id).filter(e=>!extra.some(x=>x.id===e.id)).concat(extra))(by[trimOf(e.date)]=by[trimOf(e.date)]||[]).push(e);
  const r={};for(const t in by){const es=by[t],ws=trimWeights(es),W=sum(ws);r[t]=W>0?sum(es.map((e,i)=>e.grade*ws[i]))/W:sum(es.map(e=>e.grade))/es.length}
  return r}
// Media de la materia = media de sus trimestres con nota
function subjAvg(id,extra){const v=Object.values(trimAvgs(id,extra));return v.length?sum(v)/v.length:null}
// Lo que vale un examen (con nota o no) en su trimestre, y si es automático
function weightOf(e){const es=subjGrades(e.subj).filter(x=>x.id!==e.id&&trimOf(x.date)===trimOf(e.date)).concat([e]);return{w:trimWeights(es)[es.length-1],auto:e.w==null}}
// Nota que hace falta en un examen para que la media de la materia llegue a su objetivo
function needGrade(e){const s=sb(e.subj);if(!s||s.target==null)return null;
  const f=x=>subjAvg(e.subj,[{...e,grade:x}]),a=f(0),b=f(10);if(b-a<1e-9)return null;
  return (s.target-a)/(b-a)*10}
function needTxt(e){const x=needGrade(e);if(x==null)return '';const tg=fmt(sb(e.subj).target,1).replace(',0','');
  if(x<=0)return `Con cualquier nota mantienes tu ${tg} de media`;
  if(x>10)return `Ni con un 10 llegas a tu ${tg} con este examen: necesitarás subir en los siguientes`;
  return `Para llegar a tu ${tg} necesitas un <b>${fmt(Math.ceil(x*10-1e-6)/10,1).replace(',0','')}</b>`}
function media2Auto(){const a=SUBJ().map(s=>subjAvg(s.id)).filter(v=>v!=null);return a.length?sum(a)/a.length:null}
const media2=()=>S.media2Manual!=null?S.media2Manual:media2Auto();
function minsBy(from,to){const m={};for(const l of S.log)if(l.date>=from&&l.date<=to)m[l.subj]=(m[l.subj]||0)+l.min;return m}
// Los días sin tiempo libre (descanso) no rompen la racha, pero tampoco suman
function streak(){const ds=new Set(S.log.map(l=>l.date));let d=today();if(!ds.has(d))d=addDays(d,-1);let n=0;
  for(let g=0;g<400;g++){if(ds.has(d))n++;else if(availOn(d)!==0)break;d=addDays(d,-1)}return n}
// Un examen de hoy no pide nota hasta que acaban las clases (14:45)
const examOver=e=>e.date<today()||(e.date===today()&&new Date().getHours()*60+new Date().getMinutes()>=885);
const pendingGrades=()=>S.events.filter(e=>e.kind==='examen'&&e.grade==null&&examOver(e)).sort((a,b)=>a.date<b.date?-1:1);
const upcoming=()=>S.events.filter(e=>e.grade==null&&!e.done&&e.date>=today()&&!(e.kind==='examen'&&examOver(e))).sort((a,b)=>a.date<b.date?-1:1);
const isDone=(day,key)=>(S.planDone[day]||[]).includes(key);
const evMins=id=>sum(S.log.filter(l=>l.eventId===id).map(l=>l.min));
// Tiempo libre de un día concreto: la excepción de ese día o, si no hay, lo normal de ese día de la semana
const availOn=day=>S.exc[day]!=null?S.exc[day]:(S.avail[parse(day).getDay()]||0);

/* ====== Horario de clase ====== */
const SLOTS=[['8:15','9:15'],['9:15','10:15'],['10:15','11:15'],['11:45','12:45'],['12:45','13:45'],['13:45','14:45']];
const toMin=s=>{const[a,b]=s.split(':').map(Number);return a*60+b};
const classesOn=day=>S.sched[parse(day).getDay()]||[];
const isSubj=c=>S.subjects.some(s=>s.id===c);
function nextClass(subj,from){for(let i=1;i<=14;i++){const d=addDays(from,i);if(classesOn(d).includes(subj))return d}return null}

/* ====== Carga de cada examen ====== */
// Minutos totales que necesita un examen o tarea
function needMin(e){
  if(e.hours!=null)return Math.round(e.hours*60);
  if(e.kind==='tarea')return 60;
  const t=sb(e.subj).target,m=(e.temas||1)*(HPT[e.subj]||HPT[ALIAS[e.subj]]||2.5)*(LV[e.level||'normal'].m)*(t>=9?1.15:1);
  return Math.round(m*60/15)*15}
// Cuántos días antes hay que empezar
function windowDays(e,n){return e.kind==='tarea'?Math.min(7,Math.max(2,Math.ceil(n/60)+1)):Math.min(28,Math.max(4,Math.ceil(n/110)+2))}
function prep(e){
  const t=today(),n=needMin(e),all=evMins(e.id),before=sum(S.log.filter(l=>l.eventId===e.id&&l.date<t).map(l=>l.min));
  const W=windowDays(e,n),start=addDays(e.date,-W),from=start>t?start:t;
  // Solo cuentan los días en los que puedes estudiar
  let days=0;for(let d=from;d<e.date;d=addDays(d,1))if(availOn(d)>0)days++;days=Math.max(1,days);
  const quota=Math.max(0,n-before)/days;
  return{n,all,W,start,from,days,quota,late:start<t&&quota>150}}
function topicNames(e){const tp=S.topics[e.subj]||[];if(!e.topicIds||!e.topicIds.length)return null;const ns=e.topicIds.map(id=>tp.find(x=>x.id===id)?.t).filter(Boolean);return ns.length?ns:null}

/* ====== Lo que se quedó sin hacer ======
   Cada día se apunta qué bloques de exámenes y tareas tocaban (S.planSnap). Al abrir la app otro día se miran
   los que no se marcaron y siguen pendientes: el plan ya los reparte solo (prep() recalcula la cuota de cada
   día), así que solo hay que decírselo al usuario (S.missed), para que se fíe del plan. */
function snapPlan(){const t=today(),sn=S.planSnap;
  if(sn&&sn.day<t){const miss=(sn.blocks||[]).filter(b=>{const e=evById(b.ev);return !isDone(sn.day,b.key)&&e&&e.grade==null&&!e.done&&e.date>=t});
    S.missed=miss.length?{day:t,from:sn.day,n:miss.length,min:sum(miss.map(b=>b.min)),subjs:[...new Set(miss.map(b=>b.subj))]}:null}
  const nw={day:t,blocks:planFor(t).blocks.filter(b=>b.eventId).map(b=>({key:b.key,ev:b.eventId,subj:b.subj,min:b.min}))};
  if(JSON.stringify(nw)!==JSON.stringify(sn)){S.planSnap=nw;save()}}
function vMissed(){const M=S.missed,t=today();if(!M||M.day!==t||M.seen)return '';
  const when=diff(M.from,t)===1?'Ayer':'El '+WDL[parse(M.from).getDay()],ns=M.subjs.map(id=>sb(id)?.name).filter(Boolean);
  const names=ns.length>2?ns.slice(0,2).join(', ')+` y ${ns.length-2} más`:ns.join(' y ');
  return `<div class="missed">${ic('cal','s')}<div style="flex:1;min-width:0"><b>${when} ${M.n===1?'quedó 1 bloque':`quedaron ${M.n} bloques`} sin hacer</b>
    <span>${names?h(names)+' · ':''}${fmtMin(M.min)}. Ya ${M.n===1?'lo he':'los he'} repartido en los próximos días antes de cada examen; no tienes que hacer nada.</span></div>
    <button class="navb" data-act="missedOk" aria-label="Entendido">${ic('x','s')}</button></div>`}

/* ====== Generador del plan diario ====== */
// Cuánto te juegas en una materia según tu media: por debajo de 7,5 sube la prioridad (hasta ×1,35 con
// suspensos) y con notas altas baja un poco (×0,85 con un 9). Si no llegas a tu objetivo, sube algo más.
// Sin notas todavía no cambia nada.
function gradeRisk(id){const a=subjAvg(id);if(a==null)return 1;const t=sb(id)?.target;
  let r=1+Math.max(-.15,Math.min(.35,(7.5-a)/10));if(t!=null&&a<t)r+=Math.min(.15,(t-a)/10);return Math.min(1.45,r)}
function planFor(day){
  const t=today(),avail=availOn(day),blocks=[];
  const evs=S.events.filter(e=>e.grade==null&&!e.done&&e.date>day).sort((a,b)=>a.date<b.date?-1:1);
  for(const e of evs){if(!avail)break;
    const p=prep(e);if(day<p.from)continue;
    let q=Math.min(300,p.quota);if(q<=0)continue;
    q=Math.max(15,Math.round(q/5)*5);
    const nb=Math.ceil(q/60),d=diff(day,e.date),ph=e.kind==='tarea'?-1:d>7?0:d>3?1:d>1?2:3;
    const frac=p.n?Math.min(.99,(p.all+Math.max(0,diff(t,day))*p.quota)/p.n):0;
    const tps=topicNames(e),T=tps?tps.length:(e.temas||1),list=TASKS[e.subj]||TASKS[ALIAS[e.subj]]||TASKS._;
    // Importancia: cuanto más cerca, más fuerte, más atrasado y peor vayas en la materia, antes va
    const rk=e.kind==='examen'?gradeRisk(e.subj):1,prio=(e.kind==='examen'?LV[e.level||'normal'].m*3:2.5)/Math.max(1,d)*(p.late?1.3:1)*rk,
      av=rk>=1.15?subjAvg(e.subj):null;
    for(let j=0;j<nb;j++){
      const ti=(Math.floor(frac*T)+j)%T,tl=tps?tps[ti]:(T>1?`Tema ${ti+1} de ${T}`:'');
      const task=ph<0?'Avanzar y terminar: '+e.title:list[Math.min(3,ph+(ph<2?j%2:0))];
      blocks.push({key:`${day}|${e.id}|${j}`,subj:e.subj,min:Math.max(15,Math.round(q/nb/5)*5),eventId:e.id,task,prio,
        info:[tl,`${e.kind==='examen'?'Examen':'Entrega'} ${inDays(d)}`,av!=null?`tu media aquí es ${fmtAvg(av)}`:''].filter(Boolean).join(' · ')})}}
  // El mismo día del examen: solo un repaso corto antes de hacerlo (mientras no haya pasado)
  for(const e of S.events.filter(e=>avail&&e.kind==='examen'&&e.grade==null&&e.date===day&&!(day===t&&examOver(e))))
    blocks.push({key:`${day}|${e.id}|hoy`,subj:e.subj,min:15,eventId:e.id,task:'Repaso rápido antes del examen: esquema y fórmulas clave',prio:99,info:'Examen hoy · sin agobios, solo refrescar'});
  blocks.sort((a,b)=>b.prio-a.prio);
  const used=sum(blocks.map(b=>b.min)),free=avail-used,dn=Math.floor(parse(day)/864e5);
  if(free>=20){
    // Primero se repasa lo que has dado ese día en clase
    const busy=new Set(blocks.map(b=>b.subj)),m=minsBy(addDays(day,-10),addDays(day,-1)),cls=new Set(classesOn(day));
    const pool=SUBJ().map((s,i)=>({id:s.id,k:(cls.has(s.id)?-1e6:0)+(m[s.id]||0)*10-(gradeRisk(s.id)-1)*400+((i+dn)%SUBJ().length)})).filter(o=>!busy.has(o.id)).sort((a,b)=>a.k-b.k);
    const n=Math.min(pool.length,free>=70?2:1);
    for(let i=0;i<n;i++){const c=cls.has(pool[i].id);blocks.push({key:`${day}|r-${pool[i].id}`,subj:pool[i].id,min:Math.min(45,Math.round(free/n/5)*5),eventId:null,
      task:(c?'Repasar lo de hoy en clase: ':'Repaso espaciado: ')+REV[(dn+i)%3],info:c?'Lo has dado hoy en clase':'Mantener fresco lo ya visto'})}}
  return{blocks,total:sum(blocks.map(b=>b.min)),avail,over:used>avail+10}}

  {t:'Añade tu primer examen',d:'Con él se monta tu plan de estudio',act:'data-act="newev" data-k="examen"',ok:()=>S.events.some(e=>e.kind==='examen')},

function vGuide(){
  const since=Date.now()-guideDoneAt;if(S.intro.steps&&since>2400)return '';
  const ok=GUIDE.map(g=>g.ok()),n=ok.filter(Boolean).length,prev=guidePrev;guidePrev=ok;
  if(!S.intro.steps&&n===GUIDE.length){S.intro.steps=1;guideDoneAt=Date.now();save();
    setTimeout(()=>{addXP(30,'primeros pasos completados');if(!sheetOpen())render()},700)}
  const fin=!!S.intro.steps;
  return `<div class="card tight guide ${fin?'gdone':''}" ${fin?`style="animation-delay:${Math.max(0,1500-(Date.now()-guideDoneAt))}ms"`:''}>
   <div class="between"><div class="eyebrow">Primeros pasos · ${n} de ${GUIDE.length}</div>${fin?`<span class="pill blue">¡Hecho!</span>`:`<button class="navb" data-act="guideHide" aria-label="Ocultar primeros pasos">${ic('x','s')}</button>`}</div>
   <div class="bar"><i style="width:${n/GUIDE.length*100}%;background:var(--acc)"></i></div>
   ${GUIDE.map((g,i)=>ok[i]?`<div class="gi ok"><span class="gck ${prev&&!prev[i]?'fx':''}">${ic('check','s')}</span><div class="gt">${g.t}</div></div>`
     :`<button class="gi" ${g.act}><span class="gck"></span><div style="flex:1;min-width:0"><div class="gt">${g.t}</div><div class="mut small">${g.d}</div></div>${ic('right','s')}</button>`).join('')}</div>`}

const TOUR=[
  {q:'.tb[data-t="inicio"]',t:'Inicio',d:'Lo que te toca hoy, tu racha y el calendario con tus exámenes y tareas.'},
  {q:'.tb[data-t="clase"]',t:'Estudio',d:'Para ponerte a estudiar cuando quieras, con temporizador y objetivos, y ver tus materias una a una.'},
  {q:'.tb[data-t="plan"]',t:'Plan',d:'Qué estudiar cada día, numerado de más a menos importante. Aquí también cambias tu tiempo libre.'},
  {q:'.tb[data-t="perfil"]',t:'Perfil',d:'Tus medias, las gráficas, la calculadora de la PAU y los ajustes.'},
  {q:'.fab',t:'El botón +',d:'Para añadir exámenes, tareas o notas, o ponerte a estudiar con el temporizador.'},
  {q:'#top [data-act="schedview"]',t:'Tu horario',d:'Discreto, aquí arriba. Ponlo una vez y el plan repasará lo que das cada día en clase.'}];
let tourI=-1,offerT=0,obJust=false;
function tourStart(){if(tourI>=0||!S.setup)return;offerHide();scrollTo(0,0);tourI=0;
  const T=document.createElement('div');T.id='tour';T.dataset.act='tourNext';
  T.innerHTML='<div class="tspot"></div><div class="tbub" role="dialog" aria-modal="true" aria-live="polite" data-act="noop"></div>';
  document.body.appendChild(T);document.body.classList.add('touring');tourShow(true);
  requestAnimationFrame(()=>T.classList.add('on'))}
function tourShow(anim){const T=$('#tour');if(!T)return;const st=TOUR[tourI],tg=$(st.q);
  if(!tg||!tg.getClientRects().length)return tourI<TOUR.length-1?(tourI++,tourShow(anim)):tourEnd();
  const r=tg.getBoundingClientRect(),p=6,sp=T.querySelector('.tspot'),b=T.querySelector('.tbub'),last=tourI===TOUR.length-1;
  const br=parseFloat(getComputedStyle(tg).borderRadius)||12;
  Object.assign(sp.style,{left:r.left-p+'px',top:r.top-p+'px',width:r.width+2*p+'px',height:r.height+2*p+'px',borderRadius:br*2>=r.height?'999px':br+p+'px'});
  if(anim)b.innerHTML=`<div class="tstep">${TOUR.map((_,i)=>`<i class="${i===tourI?'on':''}"></i>`).join('')}</div><b>${st.t}</b><p>${st.d}</p>
    <div class="tnav">${last?'<span></span>':'<button class="link left" data-act="tourEnd">Saltar</button>'}<button class="btn sm" data-act="tourNext">${last?'Entendido':'Siguiente'}</button></div>`;
  // Encima del elemento si está en la mitad de abajo; si no, debajo. La flecha apunta a su centro.
  const W=b.offsetWidth,cx=r.left+r.width/2,left=Math.max(16,Math.min(innerWidth-16-W,cx-W/2)),below=r.top+r.height/2<innerHeight/2;
  b.classList.toggle('up',below);b.classList.toggle('dn',!below);
  Object.assign(b.style,{left:left+'px',top:below?r.bottom+p+14+'px':'auto',bottom:below?'auto':innerHeight-r.top+p+14+'px'});
  b.style.setProperty('--ax',Math.max(22,Math.min(W-22,cx-left))+'px');
  if(anim){b.classList.remove('in');void b.offsetWidth;b.classList.add('in');b.querySelector('.btn').focus({preventScroll:true})}}
function tourEnd(){const T=$('#tour');tourI=-1;S.intro.tour=1;save();document.body.classList.remove('touring');
  if(T){T.classList.add('off');setTimeout(()=>T.remove(),300)}}
// Aviso pequeño encima de la barra: «¿Te enseño la app?». No tapa nada y se puede ignorar.
function offerShow(){if(S.intro.tour||!S.setup||tourI>=0||$('#offer'))return;
  const o=document.createElement('div');o.id='offer';o.className='offer';o.setAttribute('role','status');
  o.innerHTML=`<div style="flex:1;min-width:0"><b>${obJust?(S.name?`¡Listo, ${h(S.name)}!`:'¡Todo listo!'):'¿Te enseño la app?'}</b><span>${obJust?'¿Te enseño la app? Son 6 pasos rápidos.':'Son 6 pasos rápidos.'}</span></div>
    <button class="btn sm" data-act="tourGo">Vale</button><button class="navb" data-act="tourNo" aria-label="Ahora no">${ic('x','s')}</button>`;
  document.body.appendChild(o)}
function offerHide(){const o=$('#offer');if(!o)return;o.id='';o.classList.add('off');setTimeout(()=>o.remove(),260)}
addEventListener('resize',()=>{if(tourI>=0)tourShow(false)});
document.addEventListener('keydown',ev=>{if(tourI<0)return;

/* ====== Gráficas ====== */
// Línea de notas (una sola serie). Tocar un punto muestra su detalle debajo.
function lineChart(pts,o){
  const W=320,H=150,L=6,R=30,T=18,B=22,lo=Math.min(5,Math.floor(Math.min(...pts.map(p=>p.y),o.target??10))),hi=10;
  const X=i=>pts.length>1?L+8+i*(W-L-R-16)/(pts.length-1):(W-R+L)/2,Y=v=>T+(hi-v)/(hi-lo)*(H-T-B),n=pts.length-1;
  let s=`<svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="${h(o.label)}">`;
  s+=[lo,(lo+hi)/2,hi].map(v=>`<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" class="gl"/><text x="${W-R+6}" y="${Y(v)+4}" class="ax">${fmt(v,1).replace(',0','')}</text>`).join('');
  if(o.target!=null)s+=`<line x1="${L}" x2="${W-R}" y1="${Y(o.target)}" y2="${Y(o.target)}" class="tg"/><text x="${L}" y="${Y(o.target)-5}" class="ax">objetivo ${fmt(o.target,1).replace(',0','')}</text>`;
  if(n>0)s+=`<polyline pathLength="1" points="${pts.map((p,i)=>X(i)+','+Y(p.y)).join(' ')}" fill="none" stroke="${o.color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
  s+=pts.map((p,i)=>`<g class="pt" data-act="cpt" data-tip="${h(p.tip)}"><circle cx="${X(i)}" cy="${Y(p.y)}" r="14" fill="transparent"/><circle cx="${X(i)}" cy="${Y(p.y)}" r="${i===n?5:4}" fill="${o.color}" stroke="var(--card)" stroke-width="2"/><title>${h(p.tip)}</title></g>`).join('');
  s+=`<text x="${X(n)}" y="${Y(pts[n].y)-10}" text-anchor="${n?'end':'middle'}" class="vl">${fmt(pts[n].y,o.dec??1)}</text>`;
  s+=`<text x="${X(0)}" y="${H-5}" class="ax" text-anchor="${n?'start':'middle'}">${pts[0].x}</text>`+(n?`<text x="${X(n)}" y="${H-5}" class="ax" text-anchor="end">${pts[n].x}</text>`:'');
  return `<div class="chartw">${s}</svg><div class="ctip mut small">Toca un punto para ver el examen</div></div>`}
// Barras de horas por semana (últimas 8)
function weekBars(){
  const t=today(),m0=monday(t),wk=[...Array(8)].map((_,i)=>addDays(m0,-7*(7-i))),v=wk.map(w=>sum(S.log.filter(l=>l.date>=w&&l.date<=addDays(w,6)).map(l=>l.min))/60);
  const W=320,H=150,T=18,B=22,R=30,hi=Math.max(2,Math.ceil(Math.max(...v)/2)*2),bw=(W-R)/8,Y=x=>T+(hi-x)/hi*(H-T-B),base=H-B;
  const bp=(x,y,w,hh)=>{const r=Math.min(4,hh,w/2);return `M${x},${y+hh}V${y+r}Q${x},${y} ${x+r},${y}H${x+w-r}Q${x+w},${y} ${x+w},${y+r}V${y+hh}Z`};
  let s=`<svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="Horas de estudio por semana">`;
  s+=[0,hi/2,hi].map(x=>`<line x1="0" x2="${W-R}" y1="${Y(x)}" y2="${Y(x)}" class="gl"/><text x="${W-R+6}" y="${Y(x)+4}" class="ax">${fmt(x,0)} h</text>`).join('');
  s+=wk.map((w,i)=>{const x=i*bw+bw*.2,bh=base-Y(v[i]),tip=`Semana del ${dShort(w)}: ${fmtMin(v[i]*60)}`;
    return `<g class="pt" data-act="cpt" data-tip="${h(tip)}"><rect x="${i*bw}" y="${T}" width="${bw}" height="${H-T-B}" fill="transparent"/>${v[i]>0?`<path d="${bp(x,Y(v[i]),bw*.6,bh)}" fill="${i===7?'var(--acc)':'var(--bar2)'}"/>`:''}<title>${h(tip)}</title></g>`}).join('');
  s+=v[7]>0?`<text x="${7*bw+bw/2}" y="${Y(v[7])-6}" text-anchor="middle" class="vl">${fmtShort(v[7]*60)}</text>`:'';
  s+=`<text x="${bw*.2}" y="${H-5}" class="ax">${dShort(wk[0])}</text><text x="${7*bw+bw*.8}" y="${H-5}" class="ax" text-anchor="end">esta semana</text>`;
  const avg=sum(v.slice(0,7))/7;
  return `<div class="chartw">${s}</svg><div class="ctip mut small">Media de las 7 semanas anteriores: ${fmtMin(avg*60)} por semana</div></div>`}
// Puntos de notas para una materia o, con 'all', la media acumulada de todas
function gradePts(id){
  if(id!=='all')return subjGrades(id).map(e=>({x:dShort(e.date),y:e.grade,tip:`${e.title} · ${dShort(e.date)} · ${fmt(e.grade,1)}`}));
  const g=graded().sort((a,b)=>a.date<b.date?-1:1);let acc=0;
  return g.map((e,i)=>{acc+=e.grade;return{x:dShort(e.date),y:acc/(i+1),tip:`${sb(e.subj).name}: ${fmt(e.grade,1)} · media ${fmt(acc/(i+1),2)}`}})}
let chartMode='notas',chartSubj='all';
function vCharts(){
  const withG=SUBJ().filter(s=>subjGrades(s.id).length);if(chartSubj!=='all'&&!withG.some(s=>s.id===chartSubj))chartSubj='all';

function evRow(e,withPrep){const d=diff(today(),e.date),s=sb(e.subj),cls=d<=2?'hot':d<=6?'warm':'';
  let pr='';if(withPrep&&e.grade==null){const p=prep(e),f=Math.min(1,p.all/p.n);

  return `<div class="item tap" data-act="editev" data-id="${e.id}"><span class="cbar" style="background:${col(s)}"></span>
   <div style="flex:1;min-width:0"><div class="ell" style="font-weight:650">${e.kind==='examen'?'Examen':'Tarea'} · ${h(e.title)}</div><div class="mut small ell">${h(s.name)} · ${dShort(e.date)}${e.kind==='examen'&&e.grade==null?' · '+(e.temas||1)+' '+((e.temas||1)===1?'tema':'temas')+' · '+LV[e.level||'normal'].l.toLowerCase():''}</div>${pr}</div>
   <span class="pill ${cls}">${e.grade!=null?fmt(e.grade,1):inDays(d)}</span></div>`}

function vCal(){
  const t=today();let days=[],label,curM=null;
  if(cal.mode==='week'){const m=monday(cal.ref);for(let i=0;i<7;i++)days.push(addDays(m,i));label=dShort(days[0])+' – '+dShort(days[6])}
  else{const r=parse(cal.ref);curM=r.getMonth();const st=monday(iso(new Date(r.getFullYear(),curM,1)));for(let i=0;i<42;i++)days.push(addDays(st,i));
    if(parse(days[35]).getMonth()!==curM)days=days.slice(0,35);label=cap(MONL[curM])+' '+r.getFullYear()}
  const byDay={};for(const e of S.events)(byDay[e.date]=byDay[e.date]||[]).push(e);
  let o=`<div class="card"><div class="seg full"><button class="${cal.mode==='week'?'on':''}" data-act="calmode" data-m="week">Semana</button><button class="${cal.mode==='month'?'on':''}" data-act="calmode" data-m="month">Mes</button></div>
   <div class="calhead"><button class="navb" data-act="calmv" data-d="-1" aria-label="Anterior">${ic('left')}</button><div class="ttl">${label}</div><button class="navb" data-act="calmv" data-d="1" aria-label="Siguiente">${ic('right')}</button></div>
   <div class="grid7 ${cal.mode}">${'LMXJVSD'.split('').map(x=>`<div class="wd">${x}</div>`).join('')}`;
  for(const d of days){const ev=byDay[d]||[];const c=['day',d<t?'past':'',d===t?'today':'',d===cal.sel?'sel':'',curM!=null&&parse(d).getMonth()!==curM?'out':''].join(' ');
    o+=`<button class="${c}" data-act="calsel" data-d="${d}">${parse(d).getDate()}<span class="dots">${ev.slice(0,3).map(e=>`<i style="background:${col(sb(e.subj))}${e.kind==='tarea'?';border-radius:1px':''}"></i>`).join('')}</span></button>`}
  o+='</div>';
  const ev=byDay[cal.sel]||[],pl=cal.sel>=t?planFor(cal.sel):null;

  o+=ev.length?ev.map(e=>evRow(e)).join(''):`<div class="mut small" style="padding:8px 0">Sin exámenes ni tareas este día.</div>`;
  if(pl&&pl.blocks.length)o+=`<div class="mut small" style="margin-top:6px">Plan: ${fmtMin(pl.total)} · ${[...new Set(pl.blocks.map(b=>sb(b.subj).name))].join(' · ')}</div>`;
  return o+'</div></div>'}

// Horario: por defecto el día de hoy (o el lunes si es fin de semana / ya han acabado las clases del viernes)
let schedSel=null;

  const t=today(),wd=parse(t).getDay(),now=new Date(),mins=now.getHours()*60+now.getMinutes(),endT=toMin(SLOTS[SLOTS.length-1][1]);

  const isToday=schedSel===wd,cl=S.sched[schedSel]||[],up=upcoming();
  const title=isToday?(mins>=endT?'Hoy · clases terminadas':'Hoy'):schedSel===parse(addDays(t,1)).getDay()?'Mañana':cap(WDL[schedSel]);

    <div class="row" style="gap:6px"><button class="circ" style="width:38px;height:38px" data-act="schedit" aria-label="Editar horario">${ic('edit','s')}</button><button class="navb" data-act="close" aria-label="Cerrar">${ic('x')}</button></div></div>

// Marca como hechos los bloques de hoy de ese examen que cubren esos minutos (con el 60 %, como el temporizador)

  return n}

/* ====== PLAN ====== */
// Arriba: resumen de la semana con una tira de 7 días (estudio vs. tiempo libre).
// Debajo: el día elegido, con su tiempo libre editable ahí mismo; luego exámenes y estadísticas.
let planSel=null;
function vPlan(){
  const t=today();if(!planSel||planSel<t||diff(t,planSel)>6)planSel=t;
  const days=[...Array(7)].map((_,i)=>addDays(t,i)),plans=days.map(planFor);
  const mx=Math.max(60,...plans.map(p=>Math.max(p.total,p.avail)));
  const wkTot=sum(plans.map(p=>p.total)),wkAv=sum(plans.map(p=>p.avail)),overDays=plans.filter(p=>p.over).length;
  const si=days.indexOf(planSel),P=plans[si],w=parse(planSel).getDay(),isEx=S.exc[planSel]!=null;
  let o=`<div class="card"><div class="between" style="align-items:flex-start"><div><div class="eyebrow">Próximos 7 días</div>
     <div class="num" style="font-size:42px;margin-top:10px">${fmtMin(wkTot)}</div>
     <div class="mut small" style="margin-top:6px">de estudio · tienes ${fmtMin(wkAv)} libres${overDays?` · <span class="warnc">${overDays} ${overDays===1?'día pide':'días piden'} más</span>`:''}</div></div>
     <button class="btn sm ghost" style="white-space:nowrap;flex:none" data-act="availedit">${ic('clock','s')} Mi tiempo</button></div>
   <div class="wk">${days.map((d,i)=>{const p=plans[i],dd=parse(d);return `<button class="wkd ${d===planSel?'on':''}" data-act="psel" data-d="${d}" aria-label="${dLong(d)}">
     <span class="mut small">${i===0?'Hoy':'DLMXJVS'[dd.getDay()]}${S.exc[d]!=null?'<span class="warnc">•</span>':''}</span><b>${dd.getDate()}</b>
     <span class="wkbar"><i class="av" style="height:${p.avail/mx*100}%"></i><i class="pl ${p.over?'over':''}" style="height:${p.total/mx*100}%"></i></span>
     <span class="small ${p.over?'warnc':'mut'}">${p.total?fmtShort(p.total):'—'}</span></button>`}).join('')}</div>
   <div class="row mut small" style="gap:14px"><span class="row" style="gap:6px"><span class="dot" style="background:var(--acc)"></span>estudio</span><span class="row" style="gap:6px"><span class="dot" style="background:var(--free)"></span>tiempo libre</span><span class="row" style="gap:6px"><span class="dot" style="background:var(--warn)"></span>se pasa</span></div></div>`;
  if(si===0)o+=vMissed();
  // Día elegido
  const done=P.blocks.filter(b=>isDone(planSel,b.key)).length;
  o+=`<div class="card"><div class="between"><div style="font-weight:800;font-size:18px">${si===0?'Hoy':si===1?'Mañana':dLong(planSel)}</div><span class="small mut">${P.blocks.length?`${done} de ${P.blocks.length} hechos`:''}</span></div>
   <div class="freebar"><div><div class="small mut">Tiempo libre ${si===0?'hoy':'este día'}${isEx?' · <span class="warnc">solo este día</span>':''}</div><b>${fmtMin(P.avail)}</b> <span class="small ${P.over?'warnc':'mut'}">· plan ${fmtMin(P.total)}</span></div>
     <div class="row" style="gap:6px"><button class="btn icon ghost" style="background:var(--bg)" data-act="exc" data-day="${planSel}" data-d="-15" aria-label="Menos tiempo este día">−</button><button class="btn icon ghost" style="background:var(--bg)" data-act="exc" data-day="${planSel}" data-d="15" aria-label="Más tiempo este día">+</button></div></div>
   <div class="row small" style="gap:8px;flex-wrap:wrap;margin:4px 0 10px">
     ${P.avail>0?`<button class="link left small minib" data-act="excoff" data-day="${planSel}">Este día no puedo estudiar</button>`:''}
     ${isEx?`<button class="link left small minib" data-act="excdel" data-day="${planSel}">Volver a lo normal (${fmtMin(S.avail[w])})</button>`:''}
     <button class="link left small minib" style="color:var(--mut)" data-act="availedit">Cambiar todos los ${WDL[w]+(w===0||w===6?'s':'')}</button></div>
   ${P.over?`<div class="warnbox" style="margin-top:6px">${ic('alert','s')}<div>Este día el plan pide ${fmtMin(P.total-P.avail)} más de lo que tienes libre porque hay un examen cerca. Si no llegas, lo que falte se reparte en los días siguientes.</div></div>`:''}
   ${P.blocks.length?`<div class="mut small" style="margin:4px 0 2px">Ordenado de más a menos importante</div>`+P.blocks.map((b,i)=>{const s=sb(b.subj),dn=isDone(planSel,b.key);return `<div class="item"><button class="check ${dn?'on':''}" data-act="tick" data-k="${h(b.key)}" data-d="${planSel}" aria-label="Hecho">${dn?ic('check','s'):''}</button>
      <div style="flex:1;min-width:0"><div style="font-weight:600;${dn?'color:var(--mut);text-decoration:line-through':''}"><span style="color:${dn?'var(--mut)':i===0?'var(--acc2)':'var(--mut)'};font-weight:800">${i+1}.</span> ${h(b.task)}</div><div class="mut small ell">${i===0&&!dn&&b.eventId?'<span class="pill hot" style="padding:2px 7px;font-size:11.5px;margin-right:6px">Prioridad</span>':''}<span class="dot" style="background:${col(s)};width:7px;height:7px"></span> ${h(s.name)} · ${b.min} min · ${h(b.info)}</div></div>
      ${si===0&&!dn?`<button class="btn icon" data-act="start" data-k="${h(b.key)}" aria-label="Empezar">${ic('play','s')}</button>`:''}</div>`}).join('')
     :`<div class="empty">${P.avail?'Nada que preparar este día.':'Día libre: lo que tocaba se reparte en los demás días.'}</div>`}</div>`;
  // Exámenes y tareas
  const up=upcoming();
  o+=`<div class="between"><h2>Exámenes y tareas</h2><button class="circ" style="width:38px;height:38px" data-act="newev" data-k="examen" aria-label="Añadir">${ic('plus','s')}</button></div>
   <div class="card tight">${up.length?up.map(e=>evRow(e,true)).join(''):S.events.length?'<div class="empty">No hay nada pendiente. Añade un examen con el +.</div>'
     :hint('exam','Aún no tienes exámenes','Añade uno y te reparto lo que hay que estudiar en los días que tienes libres, de más a menos importante.',`<button class="btn sm" data-act="newev" data-k="examen">${ic('plus','s')} Añadir un examen</button>`)}</div>`;
  // Lo estudiado esta semana
  const ws=monday(t),m=minsBy(ws,addDays(ws,6)),tot=sum(Object.values(m)),studied=SUBJ().filter(s=>m[s.id]),mx2=Math.max(30,...Object.values(m));
  o+=`<h2>Estudiado esta semana</h2><div class="card tight"><div class="between"><span class="mut">Total</span><b>${fmtMin(tot)}</b></div>

     :'<div class="mut small" style="margin-top:8px">Aún no has registrado estudio esta semana. Usa ▶ en un bloque para cronometrarlo.</div>'}</div>
   <details class="how"><summary>¿Cómo se calcula el plan? ${ic('right','s')}</summary><div class="note" style="margin-top:6px">Cada examen tiene una carga = temas × horas por tema de esa materia × dificultad (ligero ×0,6, normal ×1, fuerte ×1,4, global ×2). Por ejemplo, Historia de España con 4 temas y "fuerte" son unas 17 h. Esas horas se reparten desde el día en que toca empezar (hasta 4 semanas antes) hasta la víspera, y si vas atrasado lo que falta se recalcula cada día. Lejos del examen toca esquema y teoría, a una semana ejercicios, a 2–3 días simulacro y la víspera repaso. El tiempo libre que sobra se usa para repasos.<br><br>El orden de cada día depende de lo cerca que esté el examen, de lo fuerte que sea, de si vas atrasado y de tu media en esa materia: si vas flojo (o por debajo de tu objetivo) sube en la lista, y si vas muy bien baja un poco.</div></details>`;
  return o}

function openAvail(){
  const tot=sum(S.avail),exl=Object.keys(S.exc).filter(d=>d>=today()).sort();
  sheet(`<div class="between"><h2 style="margin:0">Mi tiempo libre</h2><button class="navb" data-act="close" aria-label="Cerrar">${ic('x')}</button></div>

/* ====== Pasar datos a otro dispositivo (sin cuentas) ======
   Un código de texto "RUMBO1:..." con todo el estado comprimido; al cargarlo se une con lo que haya (mergeStates) */
const toB64=b=>{let s='';for(let i=0;i<b.length;i+=8192)s+=String.fromCharCode.apply(null,b.subarray(i,i+8192));return btoa(s)};
const fromB64=t=>Uint8Array.from(atob(t),c=>c.charCodeAt(0));
async function packState(){const j=JSON.stringify({...S,timer:null});
  try{if(window.CompressionStream){const st=new Blob([j]).stream().pipeThrough(new CompressionStream('gzip'));return 'RUMBO1:'+toB64(new Uint8Array(await new Response(st).arrayBuffer()))}}catch(e){}
  return 'RUMBO0:'+toB64(new TextEncoder().encode(j))}
async function unpackState(code){const m=code.replace(/\s+/g,'').match(/RUMBO([01]):([A-Za-z0-9+/=]+)/);if(!m)throw new Error('code');
  const b=fromB64(m[2]);if(m[1]==='0')return JSON.parse(new TextDecoder().decode(b));
  const st=new Blob([b]).stream().pipeThrough(new DecompressionStream('gzip'));return JSON.parse(await new Response(st).text())}

/* ====== Calculadora PAU ====== */
// Troncal de modalidad (fase de acceso) y materias de modalidad que pueden sumar en admisión
const pauTr=()=>S.pau.troncal||'mat';
const trName=()=>CAT[pauTr()]?catName(pauTr(),2):sb(pauTr()).name;
function pauMods(){const tr=pauTr(),f=S.subjects.filter(s=>s.pau==='mod'&&s.id!==tr).map(s=>s.id);
  return f.length?f:['fis','tec'].filter(id=>S.subjects.some(s=>s.id===id))}
const wOf=id=>S.pau.w[id]!=null?S.pau.w[id]:(id==='hes'||id==='fil'?0.1:0.2);
function pauCalc(){
  const m1=(S.curso||2)===2?S.media1:null,m2=media2(),nmb=m1!=null&&m2!=null?(m1+m2)/2:(m1??m2);
  // Casilla vacía: media de clase de esa materia; si no hay, la media de Bachillerato
  const P=S.pau,tr=pauTr(),v=(val,id)=>{const n=num(val);if(n!=null)return{g:n,e:false};const a=subjAvg(id)??nmb;return a!=null?{g:a,e:true}:null};
  const acc=[v(P.len,'len'),v(P.hist,P.histChoice),v(P.ing,'ing'),v(P.mat,tr)];
  const ok=acc.every(Boolean),cfg=ok?sum(acc.map(x=>x.g))/4:null;
  const access=nmb!=null&&cfg!=null?0.6*nmb+0.4*cfg:null;
  const other=P.histChoice==='hes'?'fil':'hes';
  const cands=[...pauMods().map(id=>[id,v(P.esp[id],id)]),[other,v(P.esp[other],other)],[tr,acc[3]]]
    .filter(([id,x])=>x&&x.g>=5&&wOf(id)>0).map(([id,x])=>({id,c:x.g*wOf(id),e:x.e})).sort((a,b)=>b.c-a.c).slice(0,2);
  const bonus=sum(cands.map(x=>x.c));
  return{nmb,cfg,access,bonus,cands,adm:access!=null?access+bonus:null,est:acc.some(x=>x&&x.e)||cands.some(c=>c.e),fail:cfg!=null&&(cfg<4||access<5)}}

  const P=S.pau,other=P.histChoice==='hes'?'fil':'hes';
  const inp=(k,v,ph)=>`<input class="inp n" inputmode="decimal" data-pau="${k}" value="${h(v)}" placeholder="${ph}" aria-label="Nota">`;
  const est=id=>{const a=subjAvg(id);return a!=null?'≈'+fmtAvg(a):'0–10'};
  const wsel=id=>`<select class="inp n" style="width:76px" data-pw="${id}" aria-label="Ponderación">${[0,0.1,0.2].map(w=>`<option value="${w}" ${wOf(id)==w?'selected':''}>×${fmt(w,1)}</option>`).join('')}</select>`;
  const tr=pauTr(),tn=h(trName()),c2=(S.curso||2)===2;
  sheet(`<div class="between"><h2 style="margin:0">Calculadora PAU</h2><button class="navb" data-act="close" aria-label="Cerrar">${ic('x')}</button></div>
   <div class="mut small" style="margin-top:4px">Quedan ${Math.max(0,diff(today(),S.pauDate))} días · ${dShort(S.pauDate)}</div>

let onYes=null;

let closeT=null,openT=null;
const sheetOpen=()=>$('#ov').classList.contains('on')&&!$('#ov').classList.contains('closing');
function sheet(html){if(timerInt){clearInterval(timerInt);timerInt=null}
  const ov=$('#ov'),sh=$('#sh'),fresh=!sheetOpen();clearTimeout(closeT);ov.classList.remove('closing');sh.style.transform='';sh.style.transition='';
  sh.innerHTML='<div class="grab"></div>'+html;ov.classList.add('on');sh.scrollTop=0;
  if(fresh){ov.classList.add('opening');[...sh.children].forEach((c,i)=>{c.style.animationDelay=Math.min(i,10)*28+'ms'});
    clearTimeout(openT);openT=setTimeout(()=>ov.classList.remove('opening'),800)}else ov.classList.remove('opening')}
function closeSheet(){if(timerInt){clearInterval(timerInt);timerInt=null}
  const ov=$('#ov'),sh=$('#sh');if(!sheetOpen())return;ov.classList.remove('opening');ov.classList.add('closing');
  clearTimeout(closeT);closeT=setTimeout(()=>{ov.classList.remove('on','closing');sh.innerHTML='';sh.style.transform='';sh.style.transition=''},250)}
// Deslizar la hoja hacia abajo para cerrarla (no con el temporizador en marcha)
(()=>{const sh=$('#sh');let d=null;
  sh.addEventListener('touchstart',e=>{if(sh.scrollTop>0||(S.timer&&$('#tt'))||e.target.closest('input,textarea,select'))return;d={y:e.touches[0].clientY,dy:0,t:Date.now()}},{passive:true});
  sh.addEventListener('touchmove',e=>{if(!d)return;d.dy=Math.max(0,e.touches[0].clientY-d.y);if(d.dy>4){sh.style.transition='none';sh.style.transform=`translateY(${d.dy}px)`}},{passive:true});
  sh.addEventListener('touchend',()=>{if(!d)return;const fast=d.dy>40&&Date.now()-d.t<250,dy=d.dy;d=null;
    if(dy>120||fast){closeSheet();onYes=null}else{sh.style.transition='transform .3s var(--spring)';sh.style.transform=''}});})();

/* ====== Temporizador ====== */
let timerInt=null,wake=null;

function startTimer(b){S.timer={key:b.key||null,day:today(),subj:b.subj,eventId:b.eventId||null,min:b.min,task:b.task,start:Date.now(),acc:0,paused:false,pomo:!!S.pomo,brks:0,brk:null,goals:b.goals||[]};save();openTimer()}
// Objetivos de la sesión dentro del temporizador: se tachan al tocarlos
const tGoalsHtml=T=>(T.goals||[]).map((g,i)=>`<div class="item tgoal"><button class="check ${g.done?'on':''}" data-act="tgoal" data-i="${i}" aria-label="Hecho">${g.done?ic('check','s'):''}</button><div style="flex:1;min-width:0;overflow-wrap:anywhere;${g.done?'color:var(--mut);text-decoration:line-through':''}">${h(g.t)}</div></div>`).join('');
// Descansos (si están activados): cada X min de estudio, Y de descanso (25 y 5 si no se cambian; se ajustan
// en la hoja del temporizador). El descanso es una pausa que se reanuda sola, así que no cuenta como estudio.
// No se para si quedan menos de 10 min.
const POMO={get work(){return S.pomoW||25},get rest(){return S.pomoR||5}},POMO_LIM={w:[10,120],r:[5,30]};
function pomoTick(){const T=S.timer;if(!T)return;
  if(T.brk){if(Date.now()>=T.brk){T.brk=null;T.paused=false;T.start=Date.now();save();toast('¡Fin del descanso! A seguir');try{navigator.vibrate?.([120,80,120])}catch(e){}}return}
  if(!T.pomo||T.paused)return;
  const e=elapsed()/60000,n=Math.floor(e/POMO.work);
  if(n>(T.brks||0)){T.brks=n;if(T.min-e>=10){T.acc+=Date.now()-T.start;T.paused=true;T.brkLen=POMO.rest;T.brk=Date.now()+POMO.rest*60000;save();try{navigator.vibrate?.(200)}catch(e){}}}}

  const T=S.timer,s=sb(T.subj),R=110,C=2*Math.PI*R;

   <div style="text-align:center;font-weight:750;font-size:18px;margin:8px 0 0;text-wrap:balance">${h(T.task)}</div>
   <div class="timer"><svg width="260" height="260" viewBox="0 0 260 260" style="transform:rotate(-90deg)"><circle cx="130" cy="130" r="${R}" stroke="var(--track)" stroke-width="10" fill="none"/><circle id="tc" cx="130" cy="130" r="${R}" stroke="${col(s)}" stroke-width="10" fill="none" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C}"/></svg>

   ${T.goals&&T.goals.length?`<div class="tgoals" id="tgoals">${tGoalsHtml(T)}</div>`:''}

   <button class="pomo ${T.pomo?'on':''}" data-act="tpomo" id="tpomo" role="switch" aria-checked="${!!T.pomo}"><span><b>Descansos</b><small id="pomotx">${POMO.rest} min cada ${POMO.work} min de estudio</small></span><i></i></button>
   <div class="pomoset">${[['w','Estudio',POMO.work],['r','Descanso',POMO.rest]].map(([k,l,v])=>`<div><span class="mut small">${l}</span>

/* ====== Pintar ======
   La vista entra animada solo cuando cambia (otra pestaña o paso del cuestionario); en el resto de
   repintados aparece tal cual. FX lleva los efectos de un solo uso que pide la última acción. */
let lastView=null,lastTop=null,lastRing=null,lastLvl=null,FX={};
function setMain(html,view){const m=$('#main'),enter=view!==lastView;lastView=view;m.innerHTML=html;m.classList.toggle('enter',enter);
  if(enter){const kids=m.firstElementChild&&m.firstElementChild.classList.contains('onb')?m.firstElementChild.children:m.children;
    [...kids].forEach((c,i)=>{c.style.animationDelay=Math.min(i,9)*55+'ms'});
    // Por si un dispositivo no llega a ejecutar la animación: el contenido nunca se queda oculto
    clearTimeout(setMain.t);setMain.t=setTimeout(()=>m.classList.remove('enter'),1700)}}
function setTop(html){const t=$('#top');if(html===lastTop)return;if(lastTop==null)t.classList.add('boot');lastTop=html;t.innerHTML=html;
  // El anillo de nivel se llena desde donde estaba; al subir de nivel, desde cero y con un destello
  const rc=t.querySelector('.ring circle:last-of-type');if(!rc)return;
  const C=+rc.getAttribute('stroke-dasharray'),to=+rc.getAttribute('stroke-dashoffset'),lv=lvl().n,up=lastLvl!=null&&lv>lastLvl;
  const from=up||lastRing==null?C:lastRing;lastRing=to;lastLvl=lv;if(up)t.querySelector('.ring').classList.add('lvup');
  if(from===to)return;rc.style.strokeDashoffset=from;rc.getBoundingClientRect();
  rc.style.transition='stroke-dashoffset 1.1s var(--ease) .15s';rc.style.strokeDashoffset=to}
function applyFX(){const q=s=>document.querySelector(s),k=v=>CSS.escape(v);
  if(FX.cal)q('#main .grid7')?.classList.add('fx-'+FX.cal);
  if(FX.calMode)q('#main .grid7')?.classList.add('fx-in');
  if(FX.day){q('#main .day.sel')?.classList.add('fx');q('#main .grid7+div')?.classList.add('fx-in')}
  if(FX.chart)q('#main .chartw')?.classList.add('fx');
  if(FX.psel){q('#main .wkd.on')?.classList.add('fx');q('#main .freebar')?.closest('.card')?.classList.add('fx-in')}
  if(FX.tick)q(`[data-act="tick"][data-k="${k(FX.tick)}"],[data-act="tpt"][data-id="${k(FX.tick)}"]`)?.classList.add('fx');
  FX={}}
function render(){
  applyTheme();
  document.body.classList.toggle('onbm',!S.setup);
  if(!S.setup){obSync();setTop('');
    setMain(syncReady?vOnb():`<div class="loading" aria-label="Cargando"><svg viewBox="0 0 64 64"><rect width="64" height="64" rx="15" fill="var(--logo-bg)"/><path d="M20 45 32 14 44 45 32 37.5Z" fill="var(--logo-fg)"/><path d="M32 14 44 45 32 37.5Z" fill="var(--logo-fg2)"/></svg></div>`,syncReady?'onb'+OB.step:'load');return}
  snapPlan();
  setTop(vTop());
  setMain(tab==='clase'?vClase():tab==='plan'?vPlan():tab==='perfil'?vPerfil():vInicio(),tab);
  applyFX();
  document.querySelectorAll('.tb').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
  if(tourI>=0)tourShow(false);
  else if(!S.intro.tour&&!offerT&&!$('#offer'))offerT=setTimeout(()=>{offerT=0;offerShow()},obJust?900:1800)}
render();
if(S.timer)openTimer();
setTimeout(maybeAskGrade,1500);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!sheetOpen()){render();maybeAskGrade()}});
document.addEventListener('keydown',ev=>{if(ev.key!=='Enter')return;if(ev.target.id==='onbExtra')A.obAdd();else if(ev.target.id==='sesGoal'){ev.preventDefault();A.sesAddGoal()}});
// La barra de duración de «Estudiar ahora» se actualiza sin repintar la pestaña
document.addEventListener('input',ev=>{if(ev.target.id==='addMin'&&ADD){const m=ADD.min=+ev.target.value;
    ev.target.style.setProperty('--p',(m-5)/235*100+'%');$('#addMinV').textContent=m;$('#addBtnV').textContent=fmtMin(m);return}
  if(ev.target.id!=='sesMin')return;const m=+ev.target.value;S.sesMin=m;
  ev.target.style.setProperty('--p',(m-5)/175*100+'%');$('#sesMinV').textContent=m;$('#sesEnd').innerHTML=sesEndTxt(m);save()});
initSync();
// Si la sincronización no contesta, el cuestionario sale igualmente
setTimeout(setSyncReady,5000);
</script>
